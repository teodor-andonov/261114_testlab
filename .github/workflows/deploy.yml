name: Deploy Testlab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for created/updated Git timestamps on cards
      - name: Test Transcribe prototype
        run: cd 261114_transcribe && npm test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Linkbook metadata and covers
        run: cd 261114_linkbook && npm test
      - name: Build browser-only Replicad Studio
        working-directory: 261115_replicad-studio
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run test:cad
          npm run build
      - name: Build Modular Studio
        working-directory: 261116_modular-studio
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Build Maya-to-Rhino converter
        working-directory: 261116_maya-to-3dm
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Build USD Studio
        working-directory: 261118_usd-studio
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Build CAD Studio PWA
        working-directory: 261119_cad-studio-v03
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Build USD Viewer
        working-directory: 261125_usd-viewer
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Assemble landing page and self-contained prototypes
        run: python3 .github/scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
