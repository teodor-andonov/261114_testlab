<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; frame-src 'self' blob: data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"><title>Interactive document</title><style id="pb-styles">*{box-sizing:border-box}html{background:#eee;color:#252525;font:16px/1.5 system-ui,sans-serif}body{margin:0;padding:24px}main[data-penbook]{margin:auto;max-width:100%;background:white;min-height:300px} [data-block]{min-width:0;overflow-wrap:anywhere} [data-block=container]{box-sizing:border-box} [data-block=text]>*:first-child{margin-top:0}[data-block=text]>*:last-child{margin-bottom:0}h1,h2,h3{line-height:1.15;margin:.4em 0}p{margin:.5em 0}figure{margin:0}img{display:block;max-width:100%;width:100%;object-fit:contain}figcaption{font-size:.8em;color:#666}svg{display:block;width:100%;height:auto;max-width:100%}table{border-collapse:collapse;width:100%}td,th{padding:6px;border:1px solid #bbb} [data-block=tag]{display:inline-block;background:#e6e6e6;border-radius:20px;padding:3px 10px;width:fit-content} [data-block=widget]{border:1px solid #ccc;padding:10px} [data-block=reference]{border:1px dashed #aaa;padding:8px} [data-page]{break-after:page;box-shadow:0 0 0 1px #ccc;background:white} .pb-title{font-size:30px;font-weight:650;letter-spacing:-.035em}.pb-caption{font-size:13px;color:#666}.pb-card{border:1px solid #bbb;border-radius:6px;padding:14px;background:#f8f8f6}@media print{html,body{background:white;padding:0}main[data-penbook]{max-width:none} [data-page]{box-shadow:none;break-inside:avoid} [data-page]:last-child{break-after:auto}button{display:none}}</style></head><body><main data-penbook="1" data-block="container" data-id="root-interactive" data-doc-id="demo-interactive" data-view="scroll" data-tags="design,study" style="display:flex;flex-direction:column;gap:16px;padding:28px;width:850px"><div data-block="text" data-id="interactive-title" ><h1 class="pb-title">Computational facade</h1></div><div data-block="text" data-id="interactive-prose" ><p>Vary the number of bays. The component is an isolated native HTML/CSS/JS payload.</p></div><div data-block="widget" data-id="interactive-facade" ><strong>Parametric facade</strong><template><style>body{font:14px system-ui;margin:12px}svg{width:100%;height:140px}rect{fill:#78939b;stroke:#fff}</style><label>Bays <input id="bays" type="range" min="2" max="12" value="6"></label><svg id="facade" viewBox="0 0 360 130"></svg><script>const i=document.getElementById('bays'),s=document.getElementById('facade');function draw(){s.innerHTML='';for(let n=0;n<+i.value;n++){let r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',n*360/i.value);r.setAttribute('y',15);r.setAttribute('width',360/i.value-3);r.setAttribute('height',100);s.append(r)}}i.oninput=draw;draw();</script></template><p class="pb-caption">Interactive component · activate explicitly</p></div><div data-block="widget" data-id="interactive-counter" ><strong>Counter</strong><template><style>body{font:16px system-ui;padding:15px}button{padding:10px}</style><button id="plus">Count: 0</button><script>let n=0;document.getElementById('plus').onclick=e=>e.target.textContent='Count: '+ ++n;</script></template><p class="pb-caption">Interactive component · activate explicitly</p></div></main><script data-penbook-runtime="1">(()=>{const policy="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'";document.querySelectorAll('[data-block="widget"]').forEach(b=>{const t=b.querySelector('template');if(!t)return;const frame=document.createElement('iframe');frame.title='Isolated widget';frame.style.cssText='width:100%;height:230px;border:0';const clean=()=>{const d=new DOMParser().parseFromString(t.innerHTML,'text/html');d.querySelectorAll('iframe,frame,object,embed,base,link,meta,script[src]').forEach(x=>x.remove());return d.documentElement.outerHTML};const show=run=>{frame.setAttribute('sandbox',run?'allow-scripts':'');frame.srcdoc='<meta http-equiv="Content-Security-Policy" content="'+policy+'">'+clean()};const run=document.createElement('button'),stop=document.createElement('button');run.textContent='Run';stop.textContent='Stop';run.onclick=()=>{if(confirm('Run this component?'))show(true)};stop.onclick=()=>show(false);b.append(run,stop,frame);show(false)});})();</script></body></html>
