<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; frame-src 'self' blob: data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"><title>Simple text note</title><style id="pb-styles">*{box-sizing:border-box}html{background:#eee;color:#252525;font:16px/1.5 system-ui,sans-serif}body{margin:0;padding:24px}main[data-penbook]{margin:auto;max-width:100%;background:white;min-height:300px} [data-block]{min-width:0;overflow-wrap:anywhere} [data-block=container]{box-sizing:border-box} [data-block=text]>*:first-child{margin-top:0}[data-block=text]>*:last-child{margin-bottom:0}h1,h2,h3{line-height:1.15;margin:.4em 0}p{margin:.5em 0}figure{margin:0}img{display:block;max-width:100%;width:100%;object-fit:contain}figcaption{font-size:.8em;color:#666}svg{display:block;width:100%;height:auto;max-width:100%}table{border-collapse:collapse;width:100%}td,th{padding:6px;border:1px solid #bbb} [data-block=tag]{display:inline-block;background:#e6e6e6;border-radius:20px;padding:3px 10px;width:fit-content} [data-block=widget]{border:1px solid #ccc;padding:10px} [data-block=reference]{border:1px dashed #aaa;padding:8px} [data-page]{break-after:page;box-shadow:0 0 0 1px #ccc;background:white} .pb-title{font-size:30px;font-weight:650;letter-spacing:-.035em}.pb-caption{font-size:13px;color:#666}.pb-card{border:1px solid #bbb;border-radius:6px;padding:14px;background:#f8f8f6}@media print{html,body{background:white;padding:0}main[data-penbook]{max-width:none} [data-page]{box-shadow:none;break-inside:avoid} [data-page]:last-child{break-after:auto}button{display:none}}</style></head><body><main data-penbook="1" data-block="container" data-id="root-note" data-doc-id="demo-note" data-view="scroll" data-tags="design,study" style="display:flex;flex-direction:column;gap:16px;padding:28px;width:850px"><div data-block="text" data-id="note-title" ><h1 class="pb-title">Design meeting</h1></div><div data-block="text" data-id="note-text" ><h2>Observations</h2><p>The <strong>entry</strong> should remain visible from the street.</p><ul><li>Test daylight</li><li>Review structure</li></ul><ol><li>Sketch options</li><li>Compare areas</li></ol><p><input type="checkbox"> Confirm dimensions</p><p><a href="https://example.com">Reference</a></p></div><div data-block="table" data-id="note-table" ><table><thead><tr><th>Option</th><th>Area m²</th></tr></thead><tbody><tr><td>A</td><td>125</td></tr><tr><td>B</td><td>180</td></tr></tbody></table></div><div data-block="sketch" data-id="note-sketch" ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" style="background:#faf9f5;touch-action:none"><path d="M28 180 Q95 22 162 95 T290 72 L385 180 M32 180H390 M105 145L165 145L165 105 M255 150L315 150" fill="none" stroke="#383838" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 195Q170 180 365 200" fill="none" stroke="#a36d49" stroke-width="2"/></svg></div></main><script data-penbook-runtime="1">(()=>{const policy="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'";document.querySelectorAll('[data-block="widget"]').forEach(b=>{const t=b.querySelector('template');if(!t)return;const frame=document.createElement('iframe');frame.title='Isolated widget';frame.style.cssText='width:100%;height:230px;border:0';const clean=()=>{const d=new DOMParser().parseFromString(t.innerHTML,'text/html');d.querySelectorAll('iframe,frame,object,embed,base,link,meta,script[src]').forEach(x=>x.remove());return d.documentElement.outerHTML};const show=run=>{frame.setAttribute('sandbox',run?'allow-scripts':'');frame.srcdoc='<meta http-equiv="Content-Security-Policy" content="'+policy+'">'+clean()};const run=document.createElement('button'),stop=document.createElement('button');run.textContent='Run';stop.textContent='Stop';run.onclick=()=>{if(confirm('Run this component?'))show(true)};stop.onclick=()=>show(false);b.append(run,stop,frame);show(false)});})();</script></body></html>
