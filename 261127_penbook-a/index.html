<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penbook A</title><link rel="stylesheet" href="testlab-theme.css"></head><body>
<header><strong>Penbook A</strong><span id="filename">Untitled</span><span id="dirty"></span><div class="spacer"></div><button id="commands" title="Commands (Ctrl+K)">Commands ⌘K</button><button id="toggleTree">Explorer</button><button id="toggleProps">Properties</button></header>
<main><aside id="treePanel"><h3>Documents</h3><select id="demo" aria-label="Open demo"><option value="">Open demo…</option></select><div class="row"><button id="folder">Folder</button><button id="open">Open</button><button id="new">New</button></div><div id="fileList"></div><h3>Outline</h3><div id="tree"></div></aside>
<section id="work"><div class="toolbar"><button id="undo">Undo</button><button id="redo">Redo</button><span class="separator"></span><select id="insert" aria-label="Insert block"><option value="">+ Insert</option></select><button id="draw">Draw (D)</button><input id="color" type="color" value="#333333" aria-label="Stroke colour"><input id="width" type="range" min="1" max="12" value="3" aria-label="Stroke width"><input id="opacity" type="range" min=".2" max="1" step=".2" value="1" aria-label="Stroke opacity"><button id="erase">Eraser</button><label><input id="penOnly" type="checkbox">Pen only</label><span class="separator"></span><select id="view" aria-label="View"><option value="scroll">Scroll</option><option value="canvas">Canvas</option><option value="pages">Pages</option></select><button id="prev">‹</button><span id="page">—</span><button id="next">›</button><input id="zoom" type="range" min="30" max="150" value="85" aria-label="Zoom"><button id="source">Source</button><button id="save">Save</button></div>
<div id="viewport"><iframe id="editor" title="Document editor" sandbox="allow-same-origin"></iframe></div><section id="sourcePanel" hidden><textarea id="markup" spellcheck="false" aria-label="Authoritative HTML"></textarea><div class="row"><button id="apply">Apply source</button><button id="cancel">Cancel</button></div></section><div id="status" role="status"></div></section>
<aside id="propsPanel"><h3>Selection</h3><div id="props"></div></aside></main>
<dialog id="palette"><input id="search" placeholder="Search commands…" aria-label="Search commands"><div id="commandList"></div></dialog>
<dialog id="widget"><h3>Sandboxed component</h3><p>Run only trusted code. No editor DOM or filesystem access.</p><div class="row"><button id="runWidget">Run</button><button id="stopWidget">Stop</button><button id="closeWidget">Close</button></div><iframe id="widgetFrame" title="Isolated component" sandbox=""></iframe></dialog>
<input type="file" id="fileInput" accept=".html,.htm" hidden><input type="file" id="imageInput" accept="image/*" hidden><input type="file" id="referenceInput" accept=".svg,.html" hidden><script src="document.js"></script><script src="app.js"></script></body></html>
